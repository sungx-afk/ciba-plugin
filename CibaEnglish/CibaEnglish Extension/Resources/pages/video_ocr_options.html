<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视频字幕 OCR 助手</title>
  <link rel="stylesheet" href="../css/video_ocr_options.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <div class="brand">
        <img src="../icons/icon-48.png" alt="logo" class="logo">
        <div>
          <h2>字幕 OCR 助手</h2>
          <p class="subtitle">视频字幕自动识别</p>
        </div>
      </div>
      <label class="switch" title="开启/关闭暂停自动识别">
        <input type="checkbox" id="toggle-enabled" checked>
        <span class="slider"></span>
      </label>
    </header>

    <div class="setting-row">
      <div class="setting-label">
        <span>添加单词本时上传视频截图</span>
        <p class="setting-desc">开启后，添加单词时会将当前视频画面截图一并保存到单词卡片中</p>
      </div>
      <label class="switch">
        <input type="checkbox" id="toggle-upload-screenshot">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <script src="../js/video_ocr_options.js"></script>
</body>
</html>
